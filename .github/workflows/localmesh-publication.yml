name: LocalMesh publication
on:
  workflow_run:
    workflows: [LocalMesh analysis]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write
concurrency:
  group: localmesh-publication-${{ github.repository_id }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: [self-hosted, Windows, X64, localmesh-publisher]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ritwin82/Dot75
          ref: 6292857625b3fd324eec021d3fc3bd6c232c0466
          path: localmesh-tool
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build trusted publisher
        working-directory: localmesh-tool
        shell: pwsh
        run: |
          npm install --global pnpm@10.15.1 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @localmesh/action... build
      - name: Download this analysis attempt
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: localmesh-results-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/localmesh-publication
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify provenance and publish to GitHub
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULTS: ${{ runner.temp }}\localmesh-publication\localmesh-results.json
          LOCALMESH_PLATFORM_URL: http://127.0.0.1:4100
          LOCALMESH_INGESTION_SECRET: ${{ secrets.LOCALMESH_INGESTION_SECRET }}
        run: node localmesh-tool/apps/action/dist/index.js publish --results "$env:RESULTS"
