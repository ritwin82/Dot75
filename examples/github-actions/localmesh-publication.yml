name: LocalMesh publication
on:
  workflow_run:
    workflows: [LocalMesh analysis]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write
concurrency:
  # Group retries of the same source run; other PR publications must not be
  # discarded by GitHub's single-pending-run concurrency behavior.
  group: localmesh-publication-${{ github.repository_id }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  publish:
    # Use a trusted self-hosted runner when LOCALMESH_PLATFORM_URL is reachable
    # only on the local network. This job never executes pull request SQL.
    runs-on: ${{ fromJSON(vars.LOCALMESH_PUBLISHER_RUNNER_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Validate trusted tool revision
        shell: bash
        env:
          TOOL_REF: ${{ vars.LOCALMESH_TOOL_REF }}
        run: '[[ "$TOOL_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Set LOCALMESH_TOOL_REF to a reviewed full commit SHA"; exit 1; }'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.LOCALMESH_TOOL_REPOSITORY || github.repository }}
          ref: ${{ vars.LOCALMESH_TOOL_REF }}
          path: localmesh-tool
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build reviewed publisher
        working-directory: localmesh-tool
        shell: bash
        run: |
          npm install --global pnpm@10.15.1 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @localmesh/action... build
      - name: Download this attempt only
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: localmesh-results-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/localmesh-publication
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify provenance and publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULTS: ${{ runner.temp }}/localmesh-publication/localmesh-results.json
          LOCALMESH_PLATFORM_URL: ${{ vars.LOCALMESH_PLATFORM_URL }}
          LOCALMESH_INGESTION_SECRET: ${{ secrets.LOCALMESH_INGESTION_SECRET }}
        run: node localmesh-tool/apps/action/dist/index.js publish --results "$RESULTS"
