name: LocalMesh analysis
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
# Keep the workflow unfiltered: non-migration PRs receive an explicit success.
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: localmesh-analysis-${{ github.repository_id }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
jobs:
  analyze:
    # Default isolation for fork SQL and cross-PR candidates. See deployment guide
    # before selecting a self-hosted runner using LOCALMESH_RUNNER_JSON.
    runs-on: ${{ fromJSON(vars.LOCALMESH_RUNNER_JSON || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    steps:
      - name: Validate trusted tool revision
        shell: bash
        env:
          TOOL_REF: ${{ vars.LOCALMESH_TOOL_REF }}
        run: '[[ "$TOOL_REF" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "Set LOCALMESH_TOOL_REF to a reviewed full commit SHA"; exit 1; }'
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ vars.LOCALMESH_TOOL_REPOSITORY || github.repository }}
          ref: ${{ vars.LOCALMESH_TOOL_REF }}
          path: localmesh-tool
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Build reviewed tool
        working-directory: localmesh-tool
        shell: bash
        run: |
          npm install --global pnpm@10.15.1 --ignore-scripts
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @localmesh/action... --filter @localmesh/worker... build
      - name: Discover and validate
        uses: ./localmesh-tool
        with:
          token: ${{ github.token }}
          output-directory: ${{ runner.temp }}/localmesh-output
          cache-directory: ${{ runner.tool_cache }}/localmesh-discovery-${{ github.repository_id }}
      - name: Retain verified results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: localmesh-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/localmesh-output/localmesh-results.json
          retention-days: 7
          if-no-files-found: warn
      # Replay inputs contain repository SQL and fixtures. Enable only if the
      # repository artifact audience may access that material.
      - name: Retain replay inputs
        if: always() && vars.LOCALMESH_UPLOAD_REPLAY == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: localmesh-replay-${{ github.run_attempt }}
          path: ${{ runner.temp }}/localmesh-output/input-*.json
          retention-days: 7
          if-no-files-found: warn
